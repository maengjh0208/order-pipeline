services:
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'  # 9092: 호스트머신에서 직접 Kafka 접속할 때 쓰는 주소. 19092: 다른 컨테이너가 같은 Docker 네트워크 안에서 접속할 때 쓰는 주소.
      KAFKA_PROCESS_ROLES: 'broker,controller'                                               # 하나의 노드가 Zookeeper가 하던 클러스터 관리 역할(controller)과, 실제 메시지 처리 역할(broker)을 둘 다 한다.
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_started

  order-postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: order_saga
      POSTGRES_PASSWORD: order_saga
      POSTGRES_DB: order_saga
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U order_saga -d order_saga" ]
      interval: 10s
      timeout: 5s
      retries: 3

  inventory-postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U inventory -d inventory" ]
      interval: 10s
      timeout: 5s
      retries: 3

  order-saga-orchestrator:
    build: ./order-saga-orchestrator
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DATABASE_URL: postgresql+asyncpg://order_saga:order_saga@order-postgres:5432/order_saga
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./order-saga-orchestrator/src/:/app/src
      - ./order-saga-orchestrator/alembic/:/app/alembic
      - ./order-saga-orchestrator/alembic.ini:/app/alembic.ini
    depends_on:
      kafka:
        condition: service_started
      order-postgres:
        condition: service_healthy

  inventory-service:
    build: ./inventory-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@inventory-postgres:5432/inventory
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./inventory-service/src/:/app/src
      - ./inventory-service/alembic/:/app/alembic
      - ./inventory-service/alembic.ini:/app/alembic.ini
    depends_on:
      kafka:
        condition: service_started
      inventory-postgres:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./payment-service/src/:/app/src
    depends_on:
      kafka:
        condition: service_started

volumes:
  order_postgres_data:
  inventory_postgres_data: